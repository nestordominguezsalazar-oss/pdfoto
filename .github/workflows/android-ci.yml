name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests y lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Asegurar componentes del SDK (Android 36)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          [ -z "$SDKM" ] && SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "platform-tools" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Unit tests, lint y build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Comprobar alineación 16 KB de las libs nativas
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          tmp=$(mktemp -d)
          unzip -o -q "$APK" 'lib/*/*.so' -d "$tmp"
          bad=0
          while read -r so; do
            aligns=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            echo "$(basename "$(dirname "$so")")/$(basename "$so"): $aligns"
            case "$aligns" in *0x1000*) bad=1;; esac
          done < <(find "$tmp/lib" -name '*.so' | sort)
          if [ "$bad" -ne 0 ]; then
            echo "ERROR: hay librerias nativas sin alinear a 16 KB"; exit 1
          fi
          echo "OK: todas las libs nativas alineadas a 16 KB"

  # Tests instrumentados en emulador. Es "best-effort": el emulador de los runners
  # gratuitos puede ser lento/inestable, asi que no bloquea el pipeline. La verificacion
  # de referencia se hace en un dispositivo real con `connectedDebugAndroidTest`.
  instrumented:
    name: Tests instrumentados (emulador, best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Asegurar componentes del SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          [ -z "$SDKM" ] && SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "platforms;android-30" "platform-tools" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Precompilar APKs (antes de arrancar el emulador)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Tests instrumentados en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 2048
          script: chmod +x ./gradlew && ./gradlew connectedDebugAndroidTest --stacktrace; code=$?; if [ $code -ne 0 ]; then "$ANDROID_SDK_ROOT/platform-tools/adb" logcat -d -v time | tail -300; fi; exit $code

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests-instrumentados
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
